[project]
name = "construction-site-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nguyentuandungpti", email = "trgnguyen001@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite==0.22.1",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "click==8.4.2",
    "dnspython==2.8.0",
    "dotenv==0.9.9",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "idna==3.19",
    "passlib==1.7.4",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pyjwt==2.13.0",
    "pymysql==1.2.0",
    "pysqlite3>=0.6.0",
    "pytest>=9.1.1",
    "python-dotenv==1.2.3",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy==2.0.52",
    "sqlcipher3==0.6.2",
    "sqlmodel==0.0.39",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.52.3",
]

[project.scripts]
main = "construction_site_management.cli:start"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src/construction_site_management"]

